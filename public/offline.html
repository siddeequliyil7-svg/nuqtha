<!doctype html>
<html lang="ml">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#A8512C">
  <title>NUQTHA - Offline</title>
  <style>
    :root { color-scheme: light; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #FAF6F0; color: #2C221E; font-family: Georgia, serif; }
    main { max-width: 420px; margin: 24px; text-align: center; }
    .mark { width: 72px; height: 72px; margin: 0 auto 20px; display: grid; place-items: center; border-radius: 18px; background: #A8512C; color: #FFF7ED; font-size: 28px; font-weight: 800; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { margin: 0; color: #6F5D53; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <div class="mark">N</div>
    <h1>NUQTHA</h1>
    <p>നിങ്ങൾ ഇപ്പോൾ ഓഫ്‍ലൈനാണ്. ഇന്റർനെറ്റ് കണക്ഷൻ ലഭിക്കുമ്പോൾ വീണ്ടും തുറക്കുക.</p>
  </main>
</body>
</html>
