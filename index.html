<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUQTHA | Beyond Obvious - വായനയുടെ പുതിയ ബിന്ദു</title>
    <!-- Google Fonts Preconnect & Load (Noto Sans Malayalam, Manjari, Plus Jakarta Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700&family=Noto+Sans+Malayalam:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-[#fbf7ee] text-[#1e1b18] antialiased selection:bg-[#b4532c] selection:text-white min-h-screen flex flex-col">

    <!-- ═══════════ TOP CANOPY & FLOATING GLASS NAVIGATION ═══════════ -->
    <header class="relative w-full z-40 flex-shrink-0">
        <div class="top-canopy-band w-full"></div>

        <div class="page-wrapper header-nav-wrapper">
            <div class="pro-floating-glass-card relative">
                
                <!-- Top Row: Brand Logo & Actions aligned -->
                <div class="nav-top-row flex items-center justify-between w-full">
                    <!-- Invisible spacer for perfect centering on desktop -->
                    <div class="w-16 hidden sm:block"></div>

                    <!-- Brand Logo & Title -->
                    <div class="brand-badge flex items-center justify-center gap-2">
                        <div class="brand-icon w-7 h-7 sm:w-8 sm:h-8 rounded-xl bg-gradient-to-tr from-[#1d4ed8] to-[#3b82f6] shadow-sm shadow-blue-500/20 flex items-center justify-center p-1.5 flex-shrink-0">
                            <svg class="w-full h-full text-white" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M11.25 4.533A9.707 9.707 0 006 3a9.735 9.735 0 00-3.25.555.75.75 0 00-.5.707v14.25a.75.75 0 001 .707A8.237 8.237 0 016 18.75c1.995 0 3.823.707 5.25 1.886V4.533zM12.75 20.636A8.214 8.214 0 0118 18.75c.966 0 1.89.166 2.75.47a.75.75 0 001-.708V4.262a.75.75 0 00-.5-.707A9.735 9.735 0 0018 3a9.707 9.707 0 00-5.25 1.533v16.103z" />
                            </svg>
                        </div>
                        <span class="brand-title text-lg sm:text-2xl font-black tracking-tight text-[#1e1b18] font-english uppercase">
                            NUQTHA
                        </span>
                    </div>

                    <!-- Actions (Dark Mode Toggle & 3-Dots Button) -->
                    <div class="nav-actions flex items-center gap-1.5 sm:gap-2 relative">
                        <!-- Light / Dark Mode Toggle Button -->
                        <button id="theme-toggle-btn" class="more-dots-btn" title="Toggle Light / Dark Mode" aria-label="Toggle Theme">
                            <!-- Sun Icon (shown in dark mode) -->
                            <svg id="sun-icon" class="w-4 h-4 hidden text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                            </svg>
                            <!-- Moon Icon (shown in light mode) -->
                            <svg id="moon-icon" class="w-4 h-4 text-[#4a3c33]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                            </svg>
                        </button>

                        <!-- 3-Dots Button -->
                        <button id="dots-menu-btn" class="more-dots-btn" title="More Options" aria-label="More Options">
                            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                                <circle cx="12" cy="5" r="2" />
                                <circle cx="12" cy="12" r="2" />
                                <circle cx="12" cy="19" r="2" />
                            </svg>
                        </button>

                        <!-- Glassmorphism Dropdown Menu -->
                        <div id="dots-dropdown" class="hidden absolute right-0 top-full mt-2 w-52 glass-dropdown-menu p-2 z-50 text-left animate-in fade-in zoom-in-95 duration-150">
                            <div class="px-3 py-2 border-b border-[#ebdccb]/60 mb-1">
                                <p class="text-[10px] font-extrabold uppercase tracking-widest text-[#8c7a6b] font-english">Administration</p>
                            </div>
                            <a href="admin.html" class="dropdown-item">
                                <div class="w-7 h-7 rounded-lg bg-[#b4532c]/10 text-[#b4532c] flex items-center justify-center">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                                </div>
                                <div>
                                    <span class="font-english">Admin Dashboard</span>
                                    <p class="text-[10px] text-[#8c7a6b] font-normal">Publish & Manage</p>
                                </div>
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Category Tabs -->
                <nav id="category-nav" class="flex items-center justify-center gap-1.5 sm:gap-3 w-full font-english tracking-wider text-xs sm:text-sm font-bold uppercase mt-2.5 sm:mt-3">
                    <a href="#" data-category="ALL" class="nav-category-link active">HOME</a>
                    <a href="#" data-category="HISTORY" class="nav-category-link">HISTORY</a>
                    <a href="#" data-category="STUDY" class="nav-category-link">STUDY</a>
                    <a href="#" data-category="STORY" class="nav-category-link">STORY</a>
                </nav>

            </div>
        </div>
    </header>

    <!-- ═══════════ MAIN FEED / BLOG-ROLL ═══════════ -->
    <main class="flex-grow w-full page-wrapper feed-main-wrapper">
        
        <!-- Feed Container -->
        <div id="feed-container" class="space-y-5">
            <!-- Skeleton: Top Auto-Playing Carousel Banner -->
            <div class="carousel-section top-banner-carousel">
                <div class="flex items-center justify-between mb-3 px-1">
                    <div class="skeleton-pulse h-6 w-36 rounded-full"></div>
                    <div class="skeleton-pulse h-6 w-16 rounded-full"></div>
                </div>
                <div class="w-full aspect-[21/9] sm:aspect-[24/9] rounded-3xl skeleton-pulse"></div>
            </div>
            <!-- Skeleton: Hero Featured Card -->
            <div class="article-glass-card overflow-hidden">
                <div class="skeleton-pulse w-full" style="height: 200px; border-radius: 0;"></div>
                <div class="p-6 space-y-3">
                    <div class="skeleton-pulse h-3 w-20 rounded-full"></div>
                    <div class="skeleton-pulse h-6 w-3/4"></div>
                    <div class="skeleton-pulse h-3 w-full"></div>
                    <div class="skeleton-pulse h-3 w-5/6"></div>
                </div>
            </div>
            <!-- Skeleton: Section Header -->
            <div class="flex items-center justify-between mt-6 px-1">
                <div class="skeleton-pulse h-7 w-36 rounded-full"></div>
                <div class="skeleton-pulse h-6 w-24 rounded-full"></div>
            </div>
            <!-- Skeleton: Compact Cards -->
            <div class="article-glass-card p-3 flex items-center gap-3">
                <div class="skeleton-pulse w-20 h-20 rounded-2xl flex-shrink-0"></div>
                <div class="flex-1 space-y-2">
                    <div class="skeleton-pulse h-3 w-16 rounded-full"></div>
                    <div class="skeleton-pulse h-4 w-5/6"></div>
                    <div class="skeleton-pulse h-3 w-1/2"></div>
                </div>
            </div>
            <div class="article-glass-card p-3 flex items-center gap-3">
                <div class="skeleton-pulse w-20 h-20 rounded-2xl flex-shrink-0"></div>
                <div class="flex-1 space-y-2">
                    <div class="skeleton-pulse h-3 w-20 rounded-full"></div>
                    <div class="skeleton-pulse h-4 w-4/6"></div>
                    <div class="skeleton-pulse h-3 w-1/3"></div>
                </div>
            </div>
        </div>


    </main>

    <!-- ═══════════ FULL SCREEN READING INTERFACE (OPTION 2) ═══════════ -->
    <div id="fullscreen-reader-overlay" class="fixed inset-0 z-50 bg-[#fbf7ee] overflow-y-auto hidden">
        <!-- Top Reader Navbar -->
        <div class="sticky top-0 bg-[#fbf7ee]/90 backdrop-blur-md border-b border-[#ebdccb] px-6 py-4 flex items-center justify-between z-10">
            <button onclick="closeFullScreenReader()" class="inline-flex items-center gap-2 text-xs font-bold uppercase tracking-wider text-[#b4532c] hover:text-[#923e1b] transition font-english">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                <span>Close Reader</span>
            </button>
            <span class="text-xs font-bold text-[#8c7a6b] font-english uppercase tracking-widest">NUQTHA Reader</span>
        </div>

        <!-- Article Reader View -->
        <div class="max-w-3xl mx-auto px-6 py-12 space-y-8">
            <div class="space-y-4">
                <span id="reader-category" class="category-badge font-english">General</span>
                <h1 id="reader-title" class="text-3xl sm:text-5xl font-extrabold text-[#1e1b18] leading-tight">
                    Article Title
                </h1>
                <div class="flex items-center gap-3 text-xs text-[#8c7a6b] font-english border-b border-[#ebdccb] pb-4">
                    <span id="reader-author" class="font-bold text-[#1e1b18] text-sm">Author</span>
                    <span>•</span>
                    <span id="reader-date">Date</span>
                </div>
            </div>

            <!-- Content Area -->
            <div id="reader-content" class="text-[#2b2118] leading-relaxed pt-2">
                <!-- Injected via JS -->
            </div>

            <div class="pt-10 border-t border-[#ebdccb] text-center">
                <button onclick="closeFullScreenReader()" class="px-6 py-3 rounded-full bg-[#b4532c] text-white text-xs font-bold uppercase font-english hover:bg-[#923e1b] transition">
                    &larr; Back to Feed
                </button>
            </div>
        </div>
    </div>

    <!-- ═══════════ FOOTER ═══════════ -->
    <footer class="flex-shrink-0 bg-[#241711] text-[#cbbba9] border-t border-[#3d2c22] py-8">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs font-english tracking-wider">
            <span>&copy; 2026 NUQTHA. All rights reserved.</span>
            <a href="admin.html" class="text-[#e2936c] hover:underline font-bold">Admin Portal &rarr;</a>
        </div>
    </footer>

    <!-- App Module -->
    <script type="module" src="app.js"></script>
</body>
</html>
