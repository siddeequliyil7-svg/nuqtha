    <script>
        (function() {
            try {
                var s = localStorage.getItem("nuqtha_theme") || localStorage.getItem("theme");
                if (s === "dark") {
                    document.documentElement.classList.add("dark");
                    document.documentElement.style.colorScheme = "dark";
                } else {
                    document.documentElement.classList.remove("dark");
                    document.documentElement.style.colorScheme = "light";
                }
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="styles.css">
</head>

                <div class="w-7 h-7 sm:w-8 sm:h-8 rounded-xl bg-gradient-to-tr from-[#1d4ed8] to-[#3b82f6] shadow-sm flex items-center justify-center p-1.5 text-white flex-shrink-0 group-hover:scale-110 transition-transform">

                    <!-- Bio -->

        <!-- ═══════════ FILTER & SEARCH TOOLBAR ═══════════ -->
        <section class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 p-3.5 rounded-2xl bg-white/60 dark:bg-white/5 border border-[#ebdccb] dark:border-white/10 backdrop-blur-md">
            <!-- Category Pills Filter -->
            <div id="author-cat-filters" class="flex items-center gap-1.5 overflow-x-auto pb-1 sm:pb-0 flex-nowrap text-xs font-bold font-english">
                <button type="button" data-filter="ALL" class="cat-pill active px-3.5 py-1.5 rounded-xl bg-[#b4532c] text-white shadow-xs">ALL</button>

                <button type="button" data-filter="STORY" class="cat-pill px-3 py-1.5 rounded-xl bg-black/5 dark:bg-white/10 text-[#5a4b41] dark:text-[#cbd5e1] hover:bg-black/10 transition">STORY</button>

                <svg class="w-3.5 h-3.5 text-[#8c7a6b] absolute left-3 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>

        <!-- ═══════════ ARTICLES LISTING GRID ═══════════ -->
        <section class="space-y-4">
            <div class="flex items-center justify-between">
                <div class="category-glass-badge">
                    <span class="font-english text-xs font-black tracking-wider uppercase text-[#b4532c] dark:text-[#f87171]">STORIES & ARTICLES · </span>

                    <span id="filtered-count-badge" class="ml-1 text-[11px] px-2 py-0.5 rounded-full bg-[#b4532c]/10 text-[#b4532c] dark:text-white font-bold">0</span>

    <!-- Firebase Script -->
    <script type="module">
        import { db, doc, getDoc, collection, getDocs } from "./firebase-config.js";
        import { normalizeArticleDoc, parseTimestampMillis, formatDateSafe } from "./schema-validator.js";

        // Theme Setup
        function setupTheme() {
            const saved = localStorage.getItem("nuqtha_theme") || localStorage.getItem("theme");
            const isDark = saved === "dark";
            document.documentElement.classList.toggle("dark", isDark);
            document.documentElement.style.colorScheme = isDark ? "dark" : "light";
            document.body.classList.toggle("dark-mode", isDark);
            updateThemeIcons(isDark);

            const btn = document.getElementById("theme-toggle-btn");
            if (btn) {
                btn.addEventListener("click", () => {
                    const willBeDark = !document.documentElement.classList.contains("dark");
                    document.documentElement.classList.toggle("dark", willBeDark);
                    document.documentElement.style.colorScheme = willBeDark ? "dark" : "light";
                    document.body.classList.toggle("dark-mode", willBeDark);
                    localStorage.setItem("nuqtha_theme", willBeDark ? "dark" : "light");
                    localStorage.setItem("theme", willBeDark ? "dark" : "light");
                    updateThemeIcons(willBeDark);
                });
            }
        }

        function updateThemeIcons(isDark) {
            const sun = document.getElementById("sun-icon");
            const moon = document.getElementById("moon-icon");
            if (sun && moon) {
                sun.classList.toggle("hidden", !isDark);
                moon.classList.toggle("hidden", isDark);
            }
        }

        // Slug helper
        function slugify(text) {
            return (text || '').trim().toLowerCase().replace(/[^a-z0-9\u0D00-\u0D7F]+/g, '-');
        }

        // Extract and safely decode query params or path params
        const urlParams = new URLSearchParams(window.location.search);
        const rawId = urlParams.get('id') || '';
        const rawName = urlParams.get('name') || '';
        const rawAuthor = urlParams.get('author') || '';
        
        let idParam = rawId ? decodeURIComponent(rawId).trim() : '';
        let nameParam = rawName ? decodeURIComponent(rawName).trim() : '';
        let authorParam = nameParam || idParam || (rawAuthor ? decodeURIComponent(rawAuthor).trim() : '');
        
        // Also check if path has /profile/author/[id]
        if (!authorParam && window.location.pathname.includes('/profile/author/')) {
            authorParam = decodeURIComponent(window.location.pathname.split('/profile/author/')[1].split('/')[0].split('?')[0]);
        }

        function normalizeMalayalam(str) {
            if (!str) return '';
            return str.normalize('NFC').replace(/[\u200B-\u200D\uFEFF]/g, '').trim().toLowerCase();
        }

        let allAuthorArticles = [];
        let activeCategoryFilter = "ALL";
        let searchQuery = "";

        async function loadAuthorProfile() {
            if (!authorParam && !idParam && !nameParam) {
                document.getElementById('author-name').textContent = "എഴുത്തുകാരൻ (Author)";
                document.getElementById('author-bio').textContent = "എഴുത്തുകാരന്റെ വിവരങ്ങൾ ലഭ്യമല്ല.";
                return;
            }

            const targetSlug = slugify(idParam || authorParam);
            const targetName = nameParam || authorParam;
            const normTargetName = normalizeMalayalam(targetName);
            let authorProfile = null;

            // 1. Fetch from Firestore authors collection (SDK + REST fallback)
            let allAuthors = [];
            try {
                const authorsSnap = await getDocs(collection(db, "authors"));
                authorsSnap.forEach(d => {
                    allAuthors.push({ id: d.id, ...d.data() });
                });
            } catch (e) {
                console.warn("[author.html] Authors SDK fetch error, trying REST:", e);
            }

            if (allAuthors.length === 0) {
                try {
                    const res = await fetch("https://firestore.googleapis.com/v1/projects/nuqtha-c0900/databases/(default)/documents/authors?key=AIzaSyBTKoMKudzOtgv-BY5jlgs7dNl62S9e");
                    if (res.ok) {
                        const json = await res.json();
                        if (json && json.documents) {
                            json.documents.forEach(docItem => {
                                const docId = decodeURIComponent(docItem.name.split("/").pop());
                                const data = { id: docId };
                                if (docItem.fields) {
                                    for (const [k, v] of Object.entries(docItem.fields)) {
                                        if (v.stringValue !== undefined) data[k] = v.stringValue;
                                    }
                                }
                                allAuthors.push(data);
                            });
                        }
                    }
                } catch (e) {
                    console.warn("[author.html] Authors REST fetch error:", e);
                }
            }

            // Find matching author from collection
            if (allAuthors.length > 0) {
                authorProfile = allAuthors.find(a => {
                    const aId = (a.id || '').trim();
                    const aSlug = (a.slug || slugify(a.name || a.id)).trim();
                    const aNormName = normalizeMalayalam(a.name);

                    if (targetSlug && (aId === targetSlug || aSlug === targetSlug || slugify(a.name) === targetSlug)) return true;
                    if (idParam && (aId === idParam || aSlug === idParam)) return true;
                    if (normTargetName && aNormName === normTargetName) return true;
                    if (targetName && a.name && (a.name.includes(targetName) || targetName.includes(a.name))) return true;
                    return false;
                });
            }

            // Also try direct document read if still not found
            if (!authorProfile && targetSlug) {
                try {
                    const authorRef = doc(db, "authors", targetSlug);
                    const snap = await getDoc(authorRef);
                    if (snap.exists()) {
                        authorProfile = snap.data();
                    }
                } catch (e) {
                    console.warn("[author.html] Direct author doc read error:", e);
                }
            }

            // 2. Fetch all articles from Firestore
            let allArticles = [];
            try {
                const snap = await getDocs(collection(db, "articles"));
                snap.forEach(d => {
                    allArticles.push(normalizeArticleDoc(d.data(), d.id));
                });
            } catch (e) {
                console.warn("[author.html] Collection fetch error, fallback to REST:", e);
            }

            // Fallback REST if empty
            if (allArticles.length === 0) {
                try {
                    const res = await fetch(`https://firestore.googleapis.com/v1/projects/nuqtha-c0900/databases/(default)/documents/articles?pageSize=100&key=AIzaSyBTKoMKudzOtgv-BY5jlgs7dNl62S9e`);
                    if (res.ok) {
                        const json = await res.json();
                        if (json && json.documents) {
                            json.documents.forEach(docItem => {
                                const docId = docItem.name.split("/").pop();
                                const data = {};
                                if (docItem.fields) {
                                    for (const [k, v] of Object.entries(docItem.fields)) {
                                        if (v.stringValue !== undefined) data[k] = v.stringValue;
                                        else if (v.integerValue !== undefined) data[k] = parseInt(v.integerValue, 10);
                                        else if (v.timestampValue !== undefined) data[k] = v.timestampValue;
                                        else if (v.booleanValue !== undefined) data[k] = v.booleanValue;
                                        else if (v.arrayValue && v.arrayValue.values) {
                                            data[k] = v.arrayValue.values.map(val => val.stringValue || (val.mapValue ? val.mapValue.fields : val));
                                        } else {
                                            data[k] = null;
                                        }
                                    }
                                }
                                allArticles.push(normalizeArticleDoc(data, docId));
                            });
                        }
                    }
                } catch (err) {
                    console.error("[author.html] REST fetch error:", err);
                }
            }

            // Filter articles belonging to this author
            allAuthorArticles = allArticles.filter(art => {
                const artAuthor = (art.author || "").trim();
                const artAuthorId = (art.authorId || "").trim();
                return slugify(artAuthor) === targetSlug || 
                       slugify(artAuthorId) === targetSlug ||
                       artAuthor.toLowerCase() === authorParam.toLowerCase() ||
                       (authorProfile && authorProfile.name && artAuthor.toLowerCase() === authorProfile.name.toLowerCase());
            });

            // Sort newest first
            allAuthorArticles.sort((a, b) => {
                const tA = parseTimestampMillis(a.createdAt);
                const tB = parseTimestampMillis(b.createdAt);
                return tB - tA;
            });

            // Populate Author Profile Card
            const displayName = (authorProfile && authorProfile.name) || 
                                (allAuthorArticles[0] && allAuthorArticles[0].author) || 
                                decodeURIComponent(authorParam).replace(/-/g, ' ');

            const displayRole = (authorProfile && authorProfile.role) || "CONTRIBUTOR · എഴുത്തുകാരൻ";
            const displayBio = (authorProfile && authorProfile.bio) || 
                               `${displayName} - NUQTHA-യിൽ ലേഖനങ്ങളും പഠനങ്ങളും പ്രസിദ്ധീകരിക്കുന്ന എഴുത്തുകാരൻ.`;

            document.title = `${displayName} - Author Profile | NUQTHA`;
            document.getElementById('author-name').textContent = displayName;
            document.getElementById('author-role-badge').textContent = displayRole;
            document.getElementById('author-bio').textContent = displayBio;

            const avatarEl = document.getElementById('author-avatar');
            if (authorProfile && authorProfile.photoUrl) {
                avatarEl.innerHTML = `<img src="${authorProfile.photoUrl}" alt="${displayName}" class="w-full h-full object-cover rounded-3xl" />`;
            } else {
                avatarEl.textContent = displayName.trim().charAt(0).toUpperCase() || "N";
            }

            // Update stats
            document.getElementById('author-articles-count').textContent = `${allAuthorArticles.length} Articles`;
            const uniqueCats = new Set(allAuthorArticles.map(a => (a.category || "GENERAL").toUpperCase()));
            document.getElementById('author-categories-count').textContent = `${uniqueCats.size} Categories`;

            renderFilteredArticles();
        }

        function renderFilteredArticles() {
            const grid = document.getElementById('author-articles-grid');
            const badge = document.getElementById('filtered-count-badge');
            if (!grid) return;

            let filtered = allAuthorArticles;

            // Category filter
            if (activeCategoryFilter !== "ALL") {
                filtered = filtered.filter(a => (a.category || "").toUpperCase() === activeCategoryFilter);
            }

            // Search filter
            if (searchQuery.trim()) {
                const q = searchQuery.toLowerCase().trim();
                filtered = filtered.filter(a => 
                    (a.title || "").toLowerCase().includes(q) ||
                    (a.excerpt || "").toLowerCase().includes(q) ||
                    (a.content || "").toLowerCase().includes(q)
                );
            }

            badge.textContent = filtered.length;

            if (filtered.length === 0) {
                grid.innerHTML = `
                <div class="col-span-full py-12 text-center space-y-3 bg-white/40 dark:bg-white/5 rounded-3xl p-6 border border-dashed border-[#ebdccb] dark:border-white/10">
                    <p class="text-sm font-bold text-[#5a4b41] dark:text-[#cbd5e1]">ഈ വിഭാഗത്തിൽ ലേഖനങ്ങൾ കണ്ടെത്തിയില്ല.</p>
                    <button type="button" id="reset-author-filter-btn" class="px-4 py-2 rounded-full bg-[#b4532c] text-white text-xs font-bold font-english hover:bg-[#923e1b] transition">
                        RESET FILTERS
                    </button>
                </div>
                `;
                const resetBtn = document.getElementById('reset-author-filter-btn');
                if (resetBtn) {
                    resetBtn.addEventListener('click', () => {
                        activeCategoryFilter = "ALL";
                        searchQuery = "";
                        const searchInput = document.getElementById('author-article-search');
                        if (searchInput) searchInput.value = "";
                        updatePillUI();
                        renderFilteredArticles();
                    });
                }
                return;
            }

            grid.innerHTML = filtered.map(art => {
                const dateStr = art.date || formatDateSafe(art.createdAt, "Recent");
                const cleanTitle = (art.title || "Untitled").replace(/<[^>]*>?/gm, '');
                const preview = (art.excerpt || (art.content ? art.content.substring(0, 120) : '')).replace(/<[^>]*>?/gm, '');

                return `
                <article class="compact-recent-card group cursor-pointer hover:shadow-lg transition-all duration-300">
                    <a href="article.html?id=${art.id}" class="flex items-center p-3.5 sm:p-4 gap-3.5 w-full">
                        <div class="compact-thumbnail-wrap w-20 h-20 sm:w-24 sm:h-24 rounded-2xl overflow-hidden flex-shrink-0 bg-gradient-to-br from-[#b8542c] to-[#803113]">
                            ${art.imageUrl ? `
                                <img src="${art.imageUrl}" alt="${cleanTitle}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" loading="lazy">
                            ` : `
                                <div class="w-full h-full flex items-center justify-center text-white/70 text-[10px] font-english uppercase">
                                    ${art.category || "NUQTHA"}
                                </div>
                            `}
                        </div>
                        <div class="flex-1 min-w-0 space-y-1 sm:space-y-1.5">
                            <span class="text-[10px] font-black text-[#b4532c] dark:text-[#f87171] uppercase font-english tracking-wider">
                                [${art.category || "GENERAL"}]
                            </span>
                            <h3 class="text-sm sm:text-base font-extrabold line-clamp-2 leading-snug group-hover:text-[#b4532c] transition-colors">
                                ${cleanTitle}
                            </h3>
                            <p class="text-xs text-[#7a6758] dark:text-[#94a3b8] font-english">
                                📅 ${dateStr}
                            </p>
                        </div>
                    </a>
                </article>
                `;
            }).join('');
        }

        function updatePillUI() {
            document.querySelectorAll('#author-cat-filters .cat-pill').forEach(btn => {
                const f = btn.dataset.filter;
                if (f === activeCategoryFilter) {
                    btn.className = "cat-pill active px-3.5 py-1.5 rounded-xl bg-[#b4532c] text-white shadow-xs";
                } else {
                    btn.className = "cat-pill px-3 py-1.5 rounded-xl bg-black/5 dark:bg-white/10 text-[#5a4b41] dark:text-[#cbd5e1] hover:bg-black/10 transition";
                }
            });
        }

        // Initialize UI listeners
        document.querySelectorAll('#author-cat-filters .cat-pill').forEach(btn => {
            btn.addEventListener('click', () => {
                activeCategoryFilter = btn.dataset.filter || "ALL";
                updatePillUI();
                renderFilteredArticles();
            });
        });

        const searchInput = document.getElementById('author-article-search');
        if (searchInput) {
            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value;
                renderFilteredArticles();
            });
        }

        setupTheme();
        loadAuthorProfile();
    </script>
</body>
</html>
