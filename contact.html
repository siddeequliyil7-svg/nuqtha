<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Contact Us - Ustha Project</title>
    <script>tailwind = { config: { darkMode: 'class' } };</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        (function() {
            try {
                var s = localStorage.getItem("nuqtha_theme") || localStorage.getItem("theme");
                if (s === "dark") {
                    document.documentElement.classList.add("dark");
                    document.documentElement.style.colorScheme = "dark";
                } else {
                    document.documentElement.classList.remove("dark");
                    document.documentElement.style.colorScheme = "light";
                }
            } catch (e) {}
        })();
    </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-8 flex items-center justify-center">
    <div class="max-w-md w-full bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl text-center">
        <h2 class="text-2xl font-bold text-emerald-400 mb-2">Live Sync Test! 🎉</h2>
        <p class="text-slate-300 text-sm mb-4">ഈ ഫയൽ Antigravity Main ചാറ്റിൽ നിന്ന് ഉണ്ടാക്കിയതാണ്. IDE-യിൽ തത്സമയം വന്നു!</p>
        <span class="inline-block px-3 py-1 bg-emerald-500/20 text-emerald-300 rounded-full text-xs font-semibold">100% Synced</span>
    </div>
</body>
</html>
