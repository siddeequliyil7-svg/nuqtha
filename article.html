    <style>
        .article-body p {
            margin-bottom: 2rem;
            line-height: 2.15;
            font-size: 1.22rem;
            color: #2b2118;
            font-family: 'Anek Malayalam', sans-serif;
            letter-spacing: -0.01em;
        }
        .article-title-text {
            font-family: 'Anek Malayalam', sans-serif;
            line-height: 1.32;
        }
        .dark-mode .article-body p {
            color: #ebdccb;
        }
        .dark-mode .article-title-text {
            color: #fbf7ee;
        }

        /* Editorial Blockquote */
        .editorial-quote {
            position: relative;
            margin: 2.25rem 0;
            padding: 1.25rem 1.75rem 1.25rem 2rem;
            border-left: 4px solid var(--terracotta, #b4532c);
            background: rgba(180, 83, 44, 0.04);
            border-radius: 0 16px 16px 0;
            font-style: italic;
            font-size: 1.2rem;
            line-height: 1.9;
            color: #432818;
        }
        .editorial-quote::before {
            content: "“";
            position: absolute;
            top: -0.5rem;
            left: 0.5rem;
            font-size: 3rem;
            color: rgba(180, 83, 44, 0.25);
            font-family: Georgia, serif;
            line-height: 1;
        }
        .dark-mode .editorial-quote {
            background: rgba(255, 255, 255, 0.03);
            border-left-color: #f87171;
            color: #fde68a;
        }

        /* Related Articles Section (Matching Editorial Card Style) */
        .related-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(235, 220, 203, 0.9);
            border-radius: 18px;
            overflow: hidden;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 18px -3px rgba(70, 35, 15, 0.07);
        }
        .related-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 16px 36px -6px rgba(70, 35, 15, 0.16);
            border-color: rgba(180, 83, 44, 0.45);
            background: #ffffff;

        .dark-mode .related-card {
            background: rgba(18, 20, 29, 0.75);
            border-color: rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 18px -3px rgba(0, 0, 0, 0.45);
        }
        .dark-mode .related-card:hover {
            background: rgba(26, 30, 43, 0.92);
            border-color: rgba(255, 255, 255, 0.22);
            box-shadow: 0 16px 36px -6px rgba(0, 0, 0, 0.65);
        }
        .related-img-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background: linear-gradient(135deg, #b8542c 0%, #803113 100%);
        }
        .related-read-badge {

            left: 10px;

            align-items: center;
            gap: 5px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            letter-spacing: 0.02em;
            z-index: 2;
        }

    <!-- Script to load article details from Firestore -->
    <script type="module">
        import { db, doc, getDoc, collection, getDocs } from "./firebase-config.js";
        import { normalizeArticleDoc, parseTimestampMillis, formatDateSafe } from "./schema-validator.js";

        const urlParams = new URLSearchParams(window.location.search);
        const articleId = urlParams.get('id');

        async function loadArticle() {
            if (!articleId) {
                showError("ലേഖനത്തിന്റെ ഐഡി നൽകിയിട്ടില്ല.");
                return;
            }

            let article = null;

            // 1. First fetch directly by Document ID (fast & reliable)
            try {
                const docRef = doc(db, "articles", articleId);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    // Normalize & sanitize all fields — safe fallbacks, no crashes
                    article = normalizeArticleDoc(docSnap.data(), docSnap.id);
                }
            } catch (e) {
                console.warn("[article.html] Direct doc fetch error, fallback to collection query:", e);
            }

            // 2. Fallback: Query all documents if direct fetch had issues
            if (!article) {
                try {
                    const snap = await getDocs(collection(db, "articles"));
                    snap.forEach(docSnap => {
                        if (docSnap.id === articleId) {
                            article = normalizeArticleDoc(docSnap.data(), docSnap.id);
                        }
                    });
                } catch (e) {
                    console.error("[article.html] Firestore read error:", e);
                }
            }

            // 3. Fallback: Direct Firestore REST API (immune to gRPC/WebSocket blocking)
            if (!article) {
                try {
                    const res = await fetch(`https://firestore.googleapis.com/v1/projects/nuqtha-c0900/databases/(default)/documents/articles/${encodeURIComponent(articleId)}?key=AIzaSyBTKoMKudzOtgv-BY5jlgs7dNl62S9e`);
                    if (res.ok) {
                        const json = await res.json();
                        if (json && json.fields) {
                            const data = {};
                            for (const [k, v] of Object.entries(json.fields)) {
                                data[k] = v.stringValue !== undefined ? v.stringValue :
                                          v.integerValue !== undefined ? parseInt(v.integerValue, 10) :
                                          v.timestampValue !== undefined ? v.timestampValue : null;
                            }
                            article = normalizeArticleDoc(data, articleId);
                        }
                    }
                } catch (err) {
                    console.warn("[article.html] REST fallback error:", err);
                }
            }

            if (article) {
                renderArticle(article);
                loadRelatedArticles(article);
            } else {
                showError("ഈ ലേഖനം കണ്ടെത്താനായില്ല അല്ലെങ്കിൽ നീക്കം ചെയ്തിരിക്കുന്നു.");
            }
        }

        async function loadRelatedArticles(currentArticle) {
            const relatedSection = document.getElementById("related-articles-section");
            const relatedGrid = document.getElementById("related-articles-grid");
            if (!relatedSection || !relatedGrid) return;

            let allDocs = [];

            // 1. Fetch articles from Firestore collection
            try {
                const snap = await getDocs(collection(db, "articles"));
                snap.forEach(docSnap => {
                    allDocs.push(normalizeArticleDoc(docSnap.data(), docSnap.id));
                });
            } catch (e) {
                console.warn("[article.html] Failed to get docs for related articles, trying REST:", e);
            }

            // 2. Fallback to REST API if Firestore SDK returned empty
            if (allDocs.length === 0) {
                try {
                    const res = await fetch(`https://firestore.googleapis.com/v1/projects/nuqtha-c0900/databases/(default)/documents/articles?pageSize=20&key=AIzaSyBTKoMKudzOtgv-BY5jlgs7dNl62S9e`);
                    if (res.ok) {
                        const json = await res.json();
                        if (json && json.documents) {
                            json.documents.forEach(docItem => {
                                const docId = docItem.name.split("/").pop();
                                const data = {};
                                if (docItem.fields) {
                                    for (const [k, v] of Object.entries(docItem.fields)) {
                                        data[k] = v.stringValue !== undefined ? v.stringValue :
                                                  v.integerValue !== undefined ? parseInt(v.integerValue, 10) :
                                                  v.timestampValue !== undefined ? v.timestampValue : null;
                                    }
                                }
                                allDocs.push(normalizeArticleDoc(data, docId));
                            });
                        }
                    }
                } catch (err) {
                    console.warn("[article.html] REST fetch error for related articles:", err);
                }
            }

            // Filter out current article
            const candidates = allDocs.filter(a => a.id !== currentArticle.id);
            if (candidates.length === 0) return;

            // Prioritize articles from the SAME category first, then others
            const sameCat = candidates.filter(a => (a.category || "").toUpperCase() === (currentArticle.category || "").toUpperCase());
            const diffCat = candidates.filter(a => (a.category || "").toUpperCase() !== (currentArticle.category || "").toUpperCase());
            const sortedRelated = [...sameCat, ...diffCat].slice(0, 4);

            if (sortedRelated.length === 0) return;

            const categoryEnglishMap = {
                "HISTORY": "HISTORY",
                "STUDY": "STUDY",
                "STORY": "STORY",
                "GENERAL": "GENERAL"
            };

            relatedGrid.innerHTML = sortedRelated.map(item => {
                const catName = categoryEnglishMap[(item.category || "").toUpperCase()] || (item.category || "GENERAL").toUpperCase();
                let dateStr = item.date || "";
                if (!dateStr) {
                    try {
                        const ms = parseTimestampMillis(item.createdAt);
                        if (ms) dateStr = new Date(ms).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
                    } catch(e) {}
                }

                const cleanTitle = (item.title || "").replace(/[*_#~`]/g, "");
                const rawExcerpt = item.excerpt || (item.content ? item.content.substring(0, 100) : "");
                const cleanExcerpt = rawExcerpt.replace(/[*_#~`]/g, "").trim();

                return `
                    <a href="article.html?id=${item.id}" class="related-card group">
                        <!-- Image Container -->
                        <div class="related-img-container">
                            ${item.imageUrl ? `
                                <img src="${item.imageUrl}" alt="${cleanTitle}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                            ` : `
                                <div class="w-full h-full flex flex-col items-center justify-center p-4 text-white/80">
                                    <div class="w-10 h-10 rounded-xl bg-white/10 backdrop-blur-md flex items-center justify-center mb-1 border border-white/20">
                                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
                                    </div>
                                    <span class="text-[10px] font-bold font-english uppercase tracking-widest">${catName}</span>
                                </div>
                            `}
                        </div>

                        <!-- Card Body -->
                        <div class="p-4 sm:p-4.5 flex flex-col justify-between flex-1 gap-2">
                            <div class="space-y-1.5">
                                <span class="text-[11px] font-black text-[#b4532c] dark:text-[#f87171] uppercase tracking-wider font-english">
                                    ${catName}
                                </span>
                                <h4 class="text-sm sm:text-base font-extrabold line-clamp-2 leading-snug group-hover:text-[#b4532c] transition-colors text-[#1e1b18] dark:text-white font-['Anek_Malayalam']">
                                    ${cleanTitle}
                                </h4>
                                ${cleanExcerpt ? `
                                    <p class="text-xs text-[#5a4b41] dark:text-[#cbd5e1] line-clamp-2 leading-relaxed font-['Noto_Sans_Malayalam']">
                                        ${cleanExcerpt}
                                    </p>
                                ` : ''}
                            </div>
                            <div class="pt-2.5 border-t border-[#ebdccb]/60 dark:border-white/10 flex items-center justify-between text-[11px] text-[#8c7a6b] dark:text-[#94a3b8] font-['Noto_Sans_Malayalam']">
                                <span class="font-bold text-[#1e1b18] dark:text-white">${item.author || "NUQTHA"}</span>
                                <span>${dateStr || "Recent"}</span>
                            </div>
                        </div>
                    </a>
                `;
            }).join('');

            relatedSection.classList.remove("hidden");
        }

        function renderArticle(article) {
            // article is already normalized — all fields are guaranteed to exist
            document.title = `${article.title || "NUQTHA"} | NUQTHA`;
            
            const titleEl = document.getElementById('art-title');
            titleEl.textContent = article.title || "ലേഖനം";
            if (article.titleColor) {
                titleEl.style.color = article.titleColor;
            }

            const authorName = (article.author && article.author.trim()) ? article.author.trim() : "NUQTHA";
            document.getElementById('art-author').textContent = authorName;
            const avatarEl = document.getElementById('art-author-avatar');
            if (avatarEl) {
                avatarEl.textContent = authorName.charAt(0).toUpperCase() || "N";
            }

            const transContainer = document.getElementById('art-transcription-container');
            const transEl = document.getElementById('art-transcription');
            if (transContainer && transEl) {
                if (article.transcription && article.transcription.trim()) {
                    transEl.textContent = article.transcription.trim();
                    transContainer.classList.remove('hidden');
                } else {
                    transContainer.classList.add('hidden');
                }
            }

            // Use formatDateSafe via parseTimestampMillis for robust date handling
            let dateStr = article.date || "";
            if (!dateStr) {
                try {
                    const ms = parseTimestampMillis(article.createdAt);
                    if (ms) {
                        dateStr = new Date(ms).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
                    }
                } catch(e) {
                    console.warn("[article.html] Date parse error:", e);
                }
            }
            document.getElementById('art-date').textContent = dateStr || "Recent";
            
            if (article.imageUrl && !article.imageUrl.includes("placeholder")) {
                const img = document.getElementById('art-image');
                img.src = article.imageUrl;
                img.onerror = () => {
                    document.getElementById('art-image-wrapper').classList.add('hidden');
                    console.warn("[article.html] Cover image failed to load.");
                };
                document.getElementById('art-image-wrapper').classList.remove('hidden');
            }

            const contentEl = document.getElementById('art-content');
            
            // IF TYPE IS BOOK, RENDER INDEX PAGE
            if (article.type === "BOOK") {
                renderBookIndex(article, contentEl);
                return;
            }

            // Map font size presets to rem values
            const fontSizeMap = {
                small: "1.05rem",
                medium: "1.22rem",
                large: "1.38rem",
                xlarge: "1.55rem"
            };
            const chosenSize = fontSizeMap[article.fontSize] || "1.22rem";
            const contentStyleParts = [];
            if (article.contentColor) contentStyleParts.push(`color: ${article.contentColor}`);
            if (chosenSize) contentStyleParts.push(`font-size: ${chosenSize}`);
            const contentStyleAttr = contentStyleParts.length > 0 ? `style="${contentStyleParts.join('; ')};"` : '';
            
            contentEl.innerHTML = (article.content || article.excerpt || "")
                .split('\n\n')
                .filter(p => p.trim())
                .map(paragraph => {
                    const p = paragraph.trim();

                    // Dedicated Highlight Card Callout: :::highlight ... :::
                    if (p.startsWith(":::highlight") && p.endsWith(":::")) {
                        const inner = p.replace(/^:::highlight\s*/, "").replace(/\s*:::$/, "").trim();
                        const formattedInner = inner
                            .replace(/\*\*(.*?)\*\*/g, '<strong class="font-black">$1</strong>')
                            .replace(/==(.*?)==/g, '<mark class="text-marker">$1</mark>');
                        return `<div class="highlight-glass-card"><p>${formattedInner}</p></div>`;
                    }

                    // Subheading H2
                    if (p.startsWith("## ")) {
                        return `<h2 class="article-h2">${p.replace("## ", "")}</h2>`;
                    }
                    // Subheading H3
                    if (p.startsWith("### ")) {
                        return `<h3 class="article-h3">${p.replace("### ", "")}</h3>`;
                    }

                    // Blockquote: > quote text
                    if (p.startsWith("> ")) {
                        const quoteText = p.replace(/^>\s*/, "").trim()
                            .replace(/\*\*(.*?)\*\*/g, '<strong class="font-black">$1</strong>')
                            .replace(/==(.*?)==/g, '<mark class="text-marker">$1</mark>');
                        return `<blockquote class="editorial-quote"><p>${quoteText}</p></blockquote>`;
                    }

                    // Inline Image with Layout/Size: ![caption|size](url) or ![caption](url)
                    const imgMatch = p.match(/^!\[(.*?)(?:\|(small|medium|full))?\]\((.*?)\)$/);
                    if (imgMatch) {
                        const caption = imgMatch[1] || "";
                        const size = imgMatch[2] || "full";
                        const url = imgMatch[3];
                        const sizeClass = size === "small" ? "img-small" : size === "medium" ? "img-medium" : "img-full";
                        return `
                            <div class="article-img-wrap ${sizeClass}">
                                <img src="${url}" alt="${caption}">
                                ${caption && caption !== "ചിത്രം" ? `<div class="article-img-caption">${caption}</div>` : ''}
                            </div>
                        `;
                    }

                    // Bold and Highlight (==വാക്ക്==)
                    let formatted = p
                        .replace(/\*\*(.*?)\*\*/g, '<strong class="font-black text-[#1e1b18]">$1</strong>')
                        .replace(/==(.*?)==/g, '<mark class="text-marker">$1</mark>');

                    return `<p ${contentStyleAttr}>${formatted}</p>`;
                })
                .join('');
        }

        async function renderBookIndex(book, container) {
            // Hide default cover/header if it's a BOOK type as we will build a custom one
            document.getElementById('art-image-wrapper')?.classList.add('hidden');
            
            container.innerHTML = `
                <div class="space-y-12">
                    <!-- ═══════════ RISALA STYLE EDITION HEADER & COVER ═══════════ -->
                    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-12 items-start bg-white/60 dark:bg-[#12141d]/60 backdrop-blur-xl border border-[#ebdccb] dark:border-white/10 p-6 sm:p-10 rounded-[2.5rem] shadow-xl">
                        <!-- Left: Large Vertical Magazine Cover -->
                        <div class="lg:col-span-5 w-full max-w-sm mx-auto lg:max-w-none">
                            <div class="aspect-[3/4] rounded-3xl overflow-hidden shadow-2xl bg-[#1e1b18] relative group border-4 border-white dark:border-white/10">
                                ${book.imageUrl ? `
                                    <img src="${book.imageUrl}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105">
                                ` : `
                                    <div class="w-full h-full flex items-center justify-center text-white/50 text-2xl font-bold">📘</div>
                                `}
                            </div>
                        </div>

                        <!-- Right: Edition Details & Title -->
                        <div class="lg:col-span-7 space-y-6">
                            <div class="space-y-2">
                                <h1 class="text-2xl sm:text-3xl lg:text-4xl font-bold text-[#1e1b18] dark:text-white tracking-tight font-['Anek_Malayalam']">
                                    ${book.title}
                                </h1>
                                <p class="text-xs sm:text-sm font-bold text-[#b4532c] dark:text-[#f87171] uppercase tracking-wider font-english">
                                    Volume 15 • Issue 209 • ${book.date || 'Recent Edition'}
                                </p>
                            </div>

                            <p class="text-sm sm:text-base text-[#5a4b41] dark:text-[#cbd5e1] leading-relaxed font-['Noto_Sans_Malayalam']">
                                ${book.excerpt || book.content || 'പ്രസിദ്ധീകരണത്തിന്റെ പുതിയ ലക്കം. താഴെ നൽകിയിരിക്കുന്ന ലേഖനങ്ങൾ വായിക്കാം.'}
                            </p>

                            <div class="pt-4 border-t border-[#ebdccb] dark:border-white/10 flex items-center gap-4 text-xs font-bold text-[#8c7a6b] dark:text-[#94a3b8] font-english">
                                <span>📚 <strong id="book-count-label" class="text-[#1e1b18] dark:text-white">0</strong> Articles Published</span>
                            </div>
                        </div>
                    </div>

                    <!-- ═══════════ TABLE OF CONTENTS (RISALA LIST STYLE) ═══════════ -->
                    <div class="space-y-6">
                        <div class="border-b-2 border-[#1e1b18] dark:border-white pb-3">
                            <h3 class="text-xl sm:text-2xl font-black text-[#1e1b18] dark:text-white uppercase font-english tracking-wide">
                                TABLE OF CONTENTS / ഇൻഡക്സ്
                            </h3>
                        </div>
                        
                        <div id="book-articles-list" class="space-y-4">
                            <!-- Injected by JS -->
                            <div class="flex items-center gap-2 text-slate-400 py-16 justify-center">
                                <span class="inline-block w-5 h-5 border-2 border-[#b4532c] border-t-transparent rounded-full animate-spin"></span>
                                <span class="font-bold text-xs uppercase tracking-widest font-english">Loading articles...</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            // Fetch articles in this book
            try {
                const snap = await getDocs(collection(db, "articles"));
                const items = [];
                snap.forEach(d => {
                    const art = normalizeArticleDoc(d.data(), d.id);
                    if (art.bookName === book.bookName && art.type !== "BOOK") {
                        items.push(art);
                    }
                });

                // Sort by priority then date
                items.sort((a, b) => {
                    if (a.priority !== b.priority) return a.priority - b.priority;
                    return parseTimestampMillis(b.createdAt) - parseTimestampMillis(a.createdAt);
                });

                const listEl = document.getElementById("book-articles-list");
                const countLabel = document.getElementById("book-count-label");
                
                if (countLabel) countLabel.textContent = items.length;

                if (items.length === 0) {
                    listEl.innerHTML = `<p class="text-center text-xs text-slate-500 py-12 italic">ഈ പുസ്തകത്തിൽ ലേഖനങ്ങളൊന്നും നിലവിൽ ലഭ്യമല്ല.</p>`;
                    return;
                }

                listEl.innerHTML = items.map((art, idx) => `
                    <a href="article.html?id=${art.id}" class="group block py-5 px-6 bg-white/70 dark:bg-white/5 border-b border-[#ebdccb] dark:border-white/10 hover:bg-white dark:hover:bg-white/10 transition-all duration-300">
                        <div class="space-y-1">
                            <span class="text-[11px] font-bold text-[#b4532c] dark:text-[#f87171] uppercase tracking-widest font-english">
                                ${categoryLabel(art.category)} / ${art.author || "NUQTHA"}
                            </span>
                            <h4 class="text-base sm:text-lg font-bold text-[#1e1b18] dark:text-white group-hover:text-[#b4532c] transition-colors font-['Anek_Malayalam']">
                                ${art.title}
                            </h4>
                            ${art.transcription ? `<p class="text-xs text-[#8c7a6b] dark:text-[#94a3b8] font-['Noto_Sans_Malayalam']">📝 കേട്ടെഴുത്ത്: ${art.transcription}</p>` : ''}
                        </div>
                    </a>
                `).join("");

            } catch (err) {
                console.error("Book index load error:", err);
                document.getElementById("book-articles-list").innerHTML = `<p class="text-rose-500 text-xs text-center py-4">ലേഖനങ്ങൾ ലോഡ് ചെയ്യുന്നതിൽ പരാജയപ്പെട്ടു.</p>`;
            }
        }

        function showError(msg) {
            document.getElementById('art-title').textContent = "ലേഖനം കണ്ടെത്താനായില്ല";
            document.getElementById('art-content').innerHTML = `
                <div class="p-6 bg-amber-50 rounded-2xl border border-amber-200 text-amber-900 text-center space-y-3">
                    <p class="font-bold text-base">${msg}</p>
                    <a href="index.html" class="inline-block mt-2 px-4 py-2 rounded-xl bg-[#b4532c] text-white text-xs font-bold font-english hover:bg-[#923e1b] transition shadow">ഹോം പേജിലേക്ക് മടങ്ങുക</a>
                </div>
            `;
        }

        function setupTheme() {
            const themeBtn = document.getElementById("theme-toggle-btn");
            const sunIcon = document.getElementById("sun-icon");
            const moonIcon = document.getElementById("moon-icon");

            const savedTheme = localStorage.getItem("nuqtha_theme");
            if (savedTheme === "dark") {
                document.body.classList.add("dark-mode");
                if (sunIcon) sunIcon.classList.remove("hidden");
                if (moonIcon) moonIcon.classList.add("hidden");
            }

            if (themeBtn) {
                themeBtn.addEventListener("click", () => {
                    const isDark = document.body.classList.toggle("dark-mode");
                    localStorage.setItem("nuqtha_theme", isDark ? "dark" : "light");

                    if (isDark) {
                        if (sunIcon) sunIcon.classList.remove("hidden");
                        if (moonIcon) moonIcon.classList.add("hidden");
                    } else {
                        if (sunIcon) sunIcon.classList.add("hidden");
                        if (moonIcon) moonIcon.classList.remove("hidden");
                    }
                });
            }
        }

        window.shareArticlePage = function(platform) {
            const url = window.location.href;
            const title = document.title || "NUQTHA Article";
            if (platform === 'whatsapp') {
                window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(title + " " + url)}`, '_blank');
            } else if (platform === 'telegram') {
                window.open(`https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(title)}`, '_blank');
            } else if (platform === 'facebook') {
                window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`, '_blank');
            } else if (platform === 'instagram') {
                navigator.clipboard.writeText(url).then(() => {
                    const label = document.getElementById('page-copy-label');
                    if (label) {
                        const original = label.textContent;
                        label.textContent = 'Link Copied!';
                        setTimeout(() => { label.textContent = original; }, 2000);
                    }
                    window.open('https://www.instagram.com/', '_blank');
                }).catch(() => {
                    window.open('https://www.instagram.com/', '_blank');
                });
            } else if (platform === 'copy') {
                navigator.clipboard.writeText(url).then(() => {
                    const label = document.getElementById('page-copy-label');
                    if (label) {
                        label.textContent = 'Copied!';
                        setTimeout(() => { label.textContent = 'Copy Link'; }, 2000);
                    }
                }).catch(() => {
                    alert('Article Link: ' + url);
                });
            }
        };

        setupTheme();
        loadArticle();
    </script>
</body>
