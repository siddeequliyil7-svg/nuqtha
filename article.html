<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUQTHA | Article Reader</title>
    <!-- Google Fonts Preconnect & Load (Noto Sans Malayalam, Manjari, Plus Jakarta Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700&family=Noto+Sans+Malayalam:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
    <style>
        .article-body p {
            margin-bottom: 1.5rem;
            line-height: 2;
            font-size: 1.125rem;
            color: #2b2118;
        }
    </style>
</head>
<body class="bg-[#fbf7ee] text-[#1e1b18] antialiased selection:bg-[#b4532c] selection:text-white min-h-screen flex flex-col justify-between">

    <!-- Top Minimal Sticky Header -->
    <header class="sticky top-0 z-40 bg-[#fbf7ee]/90 backdrop-blur-md border-b border-[#ebdccb]">
        <div class="w-full max-w-[min(720px,90vw)] mx-auto px-[clamp(12px,4vw,24px)] h-14 sm:h-16 flex items-center justify-between">
            <a href="index.html" class="inline-flex items-center gap-2 text-xs font-bold uppercase tracking-wider text-[#b4532c] hover:text-[#923e1b] transition font-english">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                <span>Back to Home</span>
            </a>
            <div class="flex items-center gap-2">
                <div class="w-6 h-6 rounded-lg bg-blue-600 flex items-center justify-center text-white">
                    <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M19.5 21a3 3 0 003-3v-4.5a3 3 0 00-3-3h-1.5V9a3 3 0 00-3-3h-3.379a3 3 0 01-2.121-.879L8.379 4.043A3 3 0 006.257 3.164H4.5A3 3 0 001.5 6.164V18a3 3 0 003 3h15z"/></svg>
                </div>
                <span class="font-extrabold text-sm tracking-tight font-english">NUQTHA</span>
            </div>
            <div class="flex items-center gap-3">
                <span id="reading-time" class="text-xs text-[#8c7a6b] font-english">Reading</span>
                <!-- Theme Toggle Button -->
                <button id="theme-toggle-btn" class="more-dots-btn w-8 h-8 rounded-full flex items-center justify-center" title="Toggle Light / Dark Mode" aria-label="Toggle Theme">
                    <svg id="sun-icon" class="w-4 h-4 hidden text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                    </svg>
                    <svg id="moon-icon" class="w-4 h-4 text-[#4a3c33]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Article Container -->
    <main class="w-full max-w-[min(720px,90vw)] mx-auto px-[clamp(12px,4vw,24px)] py-10 sm:py-14 flex-1">
        <!-- Article Header -->
        <article class="space-y-8">
            <div class="space-y-4 text-center sm:text-left">
                <span id="art-category" class="category-badge font-english">General</span>
                <h1 id="art-title" class="text-[clamp(24px,7vw,48px)] font-black text-[#1e1b18] leading-tight tracking-tight">
                    ലോഡ് ചെയ്യുന്നു...
                </h1>
                
                <div class="flex items-center gap-4 pt-2 border-b border-[#ebdccb] pb-6 text-xs text-[#8c7a6b] font-english">
                    <div class="w-9 h-9 rounded-full bg-[#b4532c]/10 text-[#b4532c] flex items-center justify-center font-bold text-sm">
                        N
                    </div>
                    <div>
                        <p id="art-author" class="font-bold text-[#1e1b18] text-sm font-sans">NUQTHA</p>
                        <p id="art-date">Date</p>
                    </div>
                </div>
            </div>

            <!-- Optional Article Cover Image -->
            <div id="art-image-wrapper" class="hidden rounded-3xl overflow-hidden border border-[#ebdccb] shadow-sm">
                <img id="art-image" src="" alt="" class="w-full h-auto object-cover max-h-[450px]">
            </div>

            <!-- Full Article Body -->
            <div id="art-content" class="article-body font-sans text-lg pt-4">
                <p class="text-slate-400">ലേഖനം ലോഡ് ചെയ്യുന്നു...</p>
            </div>

            <!-- Article Footer Back Link -->
            <div class="pt-10 border-t border-[#ebdccb] flex justify-center">
                <a href="index.html" class="px-6 py-3 rounded-full bg-[#b4532c] text-white text-xs font-bold uppercase tracking-wider font-english hover:bg-[#923e1b] transition shadow-md">
                    &larr; Back to all stories
                </a>
            </div>
        </article>
    </main>

    <!-- Footer -->
    <footer class="bg-[#241711] text-[#cbbba9] border-t border-[#3d2c22] py-8 mt-16">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-xs font-english tracking-wider">
            &copy; 2026 NUQTHA. All rights reserved.
        </div>
    </footer>

    <!-- Script to load article details from Firestore or LocalStorage -->
    <script type="module">
        import { db, collection, getDocs, doc, onSnapshot } from "./firebase-config.js";

        const urlParams = new URLSearchParams(window.location.search);
        const articleId = urlParams.get('id');

        async function loadArticle() {
            if (!articleId) {
                document.getElementById('art-title').textContent = "ലേഖനം കണ്ടെത്താനായില്ല";
                return;
            }

            let article = null;

            // Fetch from shared Firestore collection
            try {
                const snap = await getDocs(collection(db, "articles"));
                snap.forEach(docSnap => {
                    if (docSnap.id === articleId) {
                        article = { id: docSnap.id, ...docSnap.data() };
                    }
                });
            } catch (e) {
                console.error("Firestore read error:", e);
            }

            if (article) {
                document.title = `${article.title} | NUQTHA`;
                
                const titleEl = document.getElementById('art-title');
                titleEl.textContent = article.title;
                if (article.titleColor) {
                    titleEl.style.color = article.titleColor;
                }

                document.getElementById('art-category').textContent = article.category || "GENERAL";
                document.getElementById('art-author').textContent = article.author || "NUQTHA";
                document.getElementById('art-date').textContent = article.date || "Recent";
                
                if (article.imageUrl && !article.imageUrl.includes("placeholder")) {
                    const img = document.getElementById('art-image');
                    img.src = article.imageUrl;
                    document.getElementById('art-image-wrapper').classList.remove('hidden');
                }

                // Reading time estimate
                const words = (article.content || "").length;
                const min = Math.max(1, Math.round(words / 400));
                document.getElementById('reading-time').textContent = `${min} min read`;

                const contentEl = document.getElementById('art-content');
                const contentColorStyle = article.contentColor ? `style="color: ${article.contentColor};"` : '';
                
                contentEl.innerHTML = (article.content || article.excerpt || "")
                    .split('\n\n')
                    .filter(p => p.trim())
                    .map(paragraph => {
                        const p = paragraph.trim();
                        // Subheading
                        if (p.startsWith("### ")) {
                            return `<h3 class="text-2xl font-bold my-6 text-[#1e1b18]">${p.replace("### ", "")}</h3>`;
                        }
                        // Inline Image
                        const imgMatch = p.match(/^!\[(.*?)\]\((.*?)\)$/);
                        if (imgMatch) {
                            return `
                                <div class="my-8 rounded-3xl overflow-hidden border border-[#ebdccb] shadow-md">
                                    <img src="${imgMatch[2]}" alt="${imgMatch[1]}" class="w-full h-auto object-cover max-h-[550px]">
                                    ${imgMatch[1] && imgMatch[1] !== "ചിത്രം" ? `<p class="text-xs text-center text-[#8c7a6b] p-3 bg-[#ebdccb]/30 italic">${imgMatch[1]}</p>` : ''}
                                </div>
                            `;
                        }
                        // Bold and Highlight
                        let formatted = p
                            .replace(/\*\*(.*?)\*\*/g, '<strong class="font-black text-[#1e1b18]">$1</strong>')
                            .replace(/==(.*?)=/g, '<mark class="bg-amber-200/90 px-1.5 py-0.5 rounded text-[#2b2118] font-semibold">$1</mark>');

                        return `<p ${contentColorStyle}>${formatted}</p>`;
                    })
                    .join('');
            } else {
                document.getElementById('art-title').textContent = "ലേഖനം കണ്ടെത്താനായില്ല";
                document.getElementById('art-content').innerHTML = `
                    <div class="p-6 bg-amber-50 rounded-2xl border border-amber-200 text-amber-900 text-center space-y-2">
                        <p class="font-bold">ഈ ലേഖനം നിലവിലില്ല അല്ലെങ്കിൽ നീക്കം ചെയ്തിരിക്കുന്നു.</p>
                        <a href="index.html" class="inline-block mt-2 text-xs font-bold text-[#b4532c] underline font-english">ഹോം പേജിലേക്ക് മടങ്ങുക</a>
                    </div>
                `;
            }
        function setupTheme() {
            const themeBtn = document.getElementById("theme-toggle-btn");
            const sunIcon = document.getElementById("sun-icon");
            const moonIcon = document.getElementById("moon-icon");

            const savedTheme = localStorage.getItem("nuqtha_theme");
            if (savedTheme === "dark") {
                document.body.classList.add("dark-mode");
                if (sunIcon) sunIcon.classList.remove("hidden");
                if (moonIcon) moonIcon.classList.add("hidden");
            }

            if (themeBtn) {
                themeBtn.addEventListener("click", () => {
                    const isDark = document.body.classList.toggle("dark-mode");
                    localStorage.setItem("nuqtha_theme", isDark ? "dark" : "light");

                    if (isDark) {
                        if (sunIcon) sunIcon.classList.remove("hidden");
                        if (moonIcon) moonIcon.classList.add("hidden");
                    } else {
                        if (sunIcon) sunIcon.classList.add("hidden");
                        if (moonIcon) moonIcon.classList.remove("hidden");
                    }
                });
            }
        }

        setupTheme();
        loadArticle();
    </script>
</body>
</html>
